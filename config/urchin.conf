# Urchin Config — https://zmk.dev/docs/config

### BLUETOOTH ###
# Max Signal Power
CONFIG_BT=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

### POWER ###
# Deep Sleep After 30 Minutes, Disconnects Bluetooth
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

### STUDIO ###
# No &studio_unlock Key, So Locking Must Be Off
CONFIG_ZMK_STUDIO_LOCKING=n

### INPUT ###
# Eager Debouncing, Lower Latency
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

### DISPLAY ###
# nice-view-gem, Animation Off to Save Battery
# https://github.com/M165437/nice-view-gem
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_GEM_ANIMATION=n
